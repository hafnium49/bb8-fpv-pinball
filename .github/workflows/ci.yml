name: Verify pinball
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:circuit
      - run: npm run test:guides
      - run: npm run test:course
      - run: npm run build
      - name: Install browser for title verification
        run: npx playwright install --with-deps chromium
      - name: Verify title layout
        run: npm run test:title:browser
      - name: Upload title screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-layout
          path: artifacts/title/
          retention-days: 7
