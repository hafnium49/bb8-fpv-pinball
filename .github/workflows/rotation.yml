name: Mobile and tablet rotation
on:
  pull_request:
    paths: ['src/**', 'scripts/rotation-browser.cjs', 'package*.json', '.github/workflows/rotation.yml']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/rotation-browser.cjs', 'package*.json', '.github/workflows/rotation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rotation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Check rotation, controls, geometry, and capture WebGL screenshots
        env:
          ROTATION_ENGINE: ${{ matrix.engine }}
        run: npm run test:rotation:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rotation-${{ matrix.engine }}-${{ github.sha }}
          path: artifacts/rotation-${{ matrix.engine }}/
          if-no-files-found: warn
