name: Phone look-around integration
on:
  pull_request:
    paths: ['src/**', 'scripts/look-around-browser.cjs', 'tests/**', 'package*.json', '.github/workflows/look-around.yml']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/look-around-browser.cjs', 'tests/**', 'package*.json', '.github/workflows/look-around.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: look-around-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  look-around:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Check synthetic sensors, lifecycle, controls, and rendered directional sweep
        env:
          LOOK_ENGINE: ${{ matrix.engine }}
        run: npm run test:look:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: look-around-${{ matrix.engine }}-${{ github.sha }}
          path: artifacts/look-around-${{ matrix.engine }}/
          if-no-files-found: warn
