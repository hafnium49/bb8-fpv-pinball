<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1060" viewBox="0 0 1340 1060" role="img" aria-labelledby="title desc">
  <title id="title">ORBIT cabinet display and thumb controls: layout specification</title>
  <desc id="desc">Three scaled layout schematics for desktop, mobile landscape and portrait. The score, balls and brief status share a top cabinet display; four toolbar actions remain accessible. Droid captions sit above left, launch and right controls. Dashed rectangles show the central FPV shot corridor kept clear. These are measured layout diagrams, not gameplay screenshots.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #e8edf0; }
      .mono { font-family: Consolas, monospace; }
      .muted { fill: #a3adb5; }
      .amber { fill: #ffc36b; }
      .cyan { fill: #63d6e8; }
      .panel { fill: #111719; stroke: #465354; stroke-width: 1.5; }
      .scene { fill: #091016; stroke: #465354; stroke-width: 2; }
      .clear { fill: #18262c; fill-opacity: .35; stroke: #759299; stroke-dasharray: 8 6; }
      .caption { fill: #111719; stroke: #63d6e8; stroke-width: 1.5; }
      .left { fill: #17282d; stroke: #63d6e8; stroke-width: 2; }
      .right { fill: #30271b; stroke: #ffc36b; stroke-width: 2; }
    </style>
    <symbol id="full" viewBox="0 0 24 24">
      <path d="M9 4H4v5M15 4h5v5M4 15v5h5M15 20h5v-5" fill="none" stroke="#e8edf0" stroke-width="2"/>
    </symbol>
    <symbol id="pause" viewBox="0 0 24 24">
      <path d="M8 5v14M16 5v14" fill="none" stroke="#e8edf0" stroke-width="2"/>
    </symbol>
  </defs>
  <rect width="1340" height="1060" fill="#080d10"/>
  <text x="32" y="44" font-size="26" font-weight="bold">ORBIT / cabinet display + thumb controls</text>
  <text x="32" y="72" font-size="15" class="muted">Layout specification • existing FPV scene sits behind these HTML surfaces • safe-area padding added at runtime</text>

  <text x="32" y="112" font-size="18" font-weight="bold">Desktop / 1440 × 900</text>
  <g transform="translate(32 132) scale(.5)">
    <rect class="scene" width="1440" height="900" rx="18"/>
    <text x="26" y="54" font-size="30" font-weight="bold" class="cyan">◎ ORBIT</text>
    <rect class="panel" x="548" y="10" width="350" height="64" rx="8"/>
    <text class="muted" x="566" y="28" font-size="12">SCORE</text>
    <text class="mono amber" x="566" y="53" font-size="28">08500</text>
    <text class="muted" x="785" y="28" font-size="12">BALLS</text>
    <text class="amber" x="785" y="49" font-size="19">● ○ ○</text>
    <text class="muted" x="566" y="67" font-size="12">CIRCUIT / BRIDGE</text>
    <rect class="panel" x="1124" y="16" width="70" height="44" rx="6"/>
    <text class="cyan" x="1159" y="43" font-size="13" text-anchor="middle">FX ECO</text>
    <rect class="panel" x="1200" y="16" width="100" height="44" rx="6"/>
    <text x="1250" y="43" font-size="13" text-anchor="middle">SOUND ON</text>
    <rect class="panel" x="1306" y="16" width="48" height="44" rx="6"/>
    <use href="#pause" x="1318" y="26" width="24" height="24"/>
    <rect class="panel" x="1360" y="16" width="48" height="44" rx="6"/>
    <use href="#full" x="1372" y="26" width="24" height="24"/>
    <rect class="clear" x="360" y="270" width="720" height="315" rx="12"/>
    <text class="muted" x="720" y="431" font-size="26" text-anchor="middle">Clear FPV shot corridor</text>
    <rect class="caption" x="510" y="750" width="420" height="32" rx="6"/>
    <text class="cyan" x="720" y="772" font-size="16" text-anchor="middle">LEFT FLIPPER!</text>
    <rect class="left" x="18" y="792" width="170" height="90" rx="8"/>
    <text class="cyan" x="103" y="831" font-size="20" text-anchor="middle">↖ LEFT</text>
    <text class="muted" x="103" y="862" font-size="14" text-anchor="middle">A / ←</text>
    <rect class="panel" x="652" y="814" width="135" height="68" rx="8"/>
    <text class="muted" x="719" y="852" font-size="17" text-anchor="middle">LAUNCH</text>
    <rect class="right" x="1252" y="792" width="170" height="90" rx="8"/>
    <text class="amber" x="1337" y="831" font-size="20" text-anchor="middle">RIGHT ↗</text>
    <text class="muted" x="1337" y="862" font-size="14" text-anchor="middle">D / →</text>
  </g>
  <text x="32" y="606" font-size="14" class="muted">One header row • opaque score/status panel • no floating radar or camera selector</text>

  <text x="1040" y="112" font-size="18" font-weight="bold">Portrait / 390 × 844</text>
  <g transform="translate(1040 132) scale(.6)">
    <rect class="scene" width="390" height="844" rx="18"/>
    <text class="cyan" x="14" y="38" font-size="18" font-weight="bold">◎ ORBIT</text>
    <rect class="panel" x="142" y="8" width="50" height="44" rx="6"/>
    <text class="cyan" x="167" y="26" font-size="12" text-anchor="middle">FX</text>
    <text class="cyan" x="167" y="42" font-size="12" text-anchor="middle">ECO</text>
    <rect class="panel" x="196" y="8" width="74" height="44" rx="6"/>
    <text x="233" y="26" font-size="12" text-anchor="middle">SOUND</text>
    <text x="233" y="42" font-size="12" text-anchor="middle">ON</text>
    <rect class="panel" x="274" y="8" width="44" height="44" rx="6"/>
    <use href="#pause" x="284" y="18" width="24" height="24"/>
    <rect class="panel" x="324" y="8" width="44" height="44" rx="6"/>
    <use href="#full" x="334" y="18" width="24" height="24"/>
    <rect class="panel" x="12" y="60" width="366" height="64" rx="8"/>
    <text class="muted" x="26" y="77" font-size="12">SCORE</text>
    <text class="mono amber" x="26" y="101" font-size="28">08500</text>
    <text class="muted" x="266" y="77" font-size="12">BALLS</text>
    <text class="amber" x="266" y="100" font-size="19">● ○ ○</text>
    <text class="muted" x="26" y="117" font-size="12">CIRCUIT / BRIDGE</text>
    <rect class="clear" x="97.5" y="253.2" width="195" height="295.4" rx="10"/>
    <text class="muted" x="195" y="387" font-size="18" text-anchor="middle">Clear FPV</text>
    <text class="muted" x="195" y="412" font-size="18" text-anchor="middle">shot corridor</text>
    <rect class="caption" x="24" y="709" width="342" height="32" rx="6"/>
    <text class="cyan" x="195" y="731" font-size="16" text-anchor="middle">LEFT FLIPPER!</text>
    <rect class="left" x="12" y="750" width="102" height="78" rx="8"/>
    <text class="cyan" x="63" y="782" font-size="16" text-anchor="middle">↖ LEFT</text>
    <text class="muted" x="63" y="809" font-size="12" text-anchor="middle">A / ←</text>
    <rect class="panel" x="138" y="764" width="114" height="64" rx="8"/>
    <text class="muted" x="195" y="802" font-size="15" text-anchor="middle">LAUNCH</text>
    <rect class="right" x="276" y="750" width="102" height="78" rx="8"/>
    <text class="amber" x="327" y="782" font-size="16" text-anchor="middle">RIGHT ↗</text>
    <text class="muted" x="327" y="809" font-size="12" text-anchor="middle">D / →</text>
  </g>
  <text x="1038" y="664" font-size="14" class="muted">Two top rows; same controls</text>

  <text x="32" y="652" font-size="18" font-weight="bold">Mobile landscape / 844 × 390</text>
  <g transform="translate(32 674) scale(.85)">
    <rect class="scene" width="844" height="390" rx="14"/>
    <text class="cyan" x="14" y="43" font-size="22" font-weight="bold">◎ ORBIT</text>
    <rect class="panel" x="142" y="8" width="270" height="56" rx="8"/>
    <text class="mono amber" x="156" y="37" font-size="25">08500</text>
    <text class="amber" x="324" y="35" font-size="18">● ○ ○</text>
    <text class="muted" x="156" y="56" font-size="12">CIRCUIT / BRIDGE</text>
    <rect class="panel" x="594" y="12" width="50" height="44" rx="6"/>
    <text class="cyan" x="619" y="29" font-size="12" text-anchor="middle">FX</text>
    <text class="cyan" x="619" y="45" font-size="12" text-anchor="middle">ECO</text>
    <rect class="panel" x="648" y="12" width="76" height="44" rx="6"/>
    <text x="686" y="29" font-size="12" text-anchor="middle">SOUND</text>
    <text x="686" y="45" font-size="12" text-anchor="middle">ON</text>
    <rect class="panel" x="728" y="12" width="44" height="44" rx="6"/>
    <use href="#pause" x="738" y="22" width="24" height="24"/>
    <rect class="panel" x="778" y="12" width="44" height="44" rx="6"/>
    <use href="#full" x="788" y="22" width="24" height="24"/>
    <rect class="clear" x="211" y="117" width="422" height="136.5" rx="10"/>
    <text class="muted" x="422" y="192" font-size="21" text-anchor="middle">Clear FPV shot corridor</text>
    <rect class="caption" x="250" y="277" width="340" height="24" rx="6"/>
    <text class="cyan" x="420" y="294" font-size="14" text-anchor="middle">LEFT FLIPPER!</text>
    <rect class="left" x="14" y="306" width="132" height="68" rx="8"/>
    <text class="cyan" x="80" y="333" font-size="16" text-anchor="middle">↖ LEFT</text>
    <text class="muted" x="80" y="357" font-size="12" text-anchor="middle">A / ←</text>
    <rect class="panel" x="370" y="322" width="104" height="52" rx="8"/>
    <text class="muted" x="422" y="352" font-size="15" text-anchor="middle">LAUNCH</text>
    <rect class="right" x="698" y="306" width="132" height="68" rx="8"/>
    <text class="amber" x="764" y="333" font-size="16" text-anchor="middle">RIGHT ↗</text>
    <text class="muted" x="764" y="357" font-size="12" text-anchor="middle">D / →</text>
  </g>
  <g transform="translate(790 733)">
    <text x="0" y="0" font-size="18" font-weight="bold">Layout rules</text>
    <text class="muted" x="0" y="36" font-size="15">• Score, balls and short status share one panel.</text>
    <text class="muted" x="0" y="68" font-size="15">• Caption strip appears only when needed.</text>
    <text class="muted" x="0" y="100" font-size="15">• Warnings highlight the matching flipper.</text>
    <text class="muted" x="0" y="132" font-size="15">• Launch is disabled while a ball is playing.</text>
    <text class="muted" x="0" y="164" font-size="15">• Music volume and detailed help sit in pause/help.</text>
    <text class="muted" x="0" y="196" font-size="15">• Important captions may wrap to two lines.</text>
    <text class="muted" x="0" y="240" font-size="14">Scaled schematics; no proposed 3D scene rendered here.</text>
  </g>
  <text class="muted" x="32" y="1035" font-size="13">The dashed region is a clearance goal for the active view, not an additional UI element. Minimum sizes also checked at 320 × 568 and 568 × 320 during implementation.</text>
</svg>
